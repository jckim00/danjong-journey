name: Build Danjong Pages
on:
  workflow_dispatch:
  push:
    paths:
      - 'source/**'
      - 'scripts/extract_images.py'
      - '.github/workflows/build-site.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Extract and optimize images
        run: python scripts/extract_images.py
      - name: Commit generated site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Build optimized Danjong HTML pages"
            git push
          fi
